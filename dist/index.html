<!doctype html><html lang=vi><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Quản lý sinh viên</title><style>*{box-sizing:border-box}body{color:#1f2937;background:#f3f4f6;margin:0;padding:30px;font-family:Arial,sans-serif}.container{background:#fff;border-radius:12px;max-width:1000px;margin:auto;padding:25px;box-shadow:0 4px 15px rgba(0,0,0,.063)}h1{text-align:center;color:#2563eb}form{grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:25px;display:grid}button,input,select{border:1px solid #d1d5db;border-radius:6px;padding:11px;font-size:15px}button{cursor:pointer;color:#fff;background:#2563eb;border:none}button:hover{opacity:.85}.add-button{grid-column:1/-1}.delete-button{background:#dc2626;padding:8px 12px}.table-wrapper{overflow-x:auto}table{background:#fff;border-collapse:collapse;width:100%}td,th{text-align:left;border:1px solid #e5e7eb;padding:13px}th{color:#fff;background:#2563eb}tr:nth-child(2n){background:#f9fafb}#message{color:#dc2626;margin-bottom:15px}@media (max-width:600px){body{padding:10px}form{grid-template-columns:1fr}.add-button{grid-column:auto}}</style><script defer src=bundle.js></script></head><body><div class=container><h1>Quản lý danh sách sinh viên</h1><form id=studentForm><input id=name placeholder="Họ và tên" required> <input type=date id=birthday required> <select id=gender required><option value>-- Chọn giới tính --<option value=Nam>Nam<option value=Nữ>Nữ<option value=Khác>Khác</select> <button type=submit class=add-button>Thêm sinh viên</button></form><p id=message role=alert><h3 id=studentCount>Danh sách sinh viên (0)</h3><div class=table-wrapper><table><thead><tr><th>ID<th>Họ và tên<th>Ngày sinh<th>Giới tính<th>Thao tác<tbody id=studentList></table></div></div></body></html>
